<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數據分析實習準備</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600;800&family=Bungee&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a study planner, calm and clear
   IDEA a student's 手帳 year-planner page, one cell per day, filled in with highlighter as you go
   PICTURE the 128-day grid (weeks x weekdays), cells coloured by skill, solid when done
   COLOUR cobalt band, white page, one colour per skill, yellow highlighter for today
   TYPE Noto Sans TC 900/700 + Outfit for numbers
   LAYOUT band with title and progress; grid full width; today card; phases as lists; resources */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10141c);--ink:light-dark(#141a22,#e9edf3);--mute:light-dark(#5d6674,#9aa4b2);--line:light-dark(#e3e6eb,#252d3a);--panel:light-dark(#f5f6f8,#171d28);--band:light-dark(#1f3fbf,#16267a);--hl:#ffd23f;--sql:#3d7bff;--excel:#1d8a4e;--py:#e0a100;--np:#4d77cf;--pbi:#8a4fff;--viz:#129a9a;--proj:#e5532d;--job:light-dark(#3a3f47,#c3c9d2);--rest:light-dark(#eceef1,#222936);--fd:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--fb:var(--fd);--fn:Outfit,"Noto Sans TC",sans-serif;--r:14px;--rs:10px;--bw:1px;--edge:var(--line);--sh:none;--hdr:var(--band);--bandink:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--fb);overflow-x:clip}
a{color:inherit}
.band{padding-block:clamp(24px,4vw,48px);padding-inline:max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.top{background:var(--hdr);color:var(--bandink)}
.top .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
h1{font-family:var(--fd);font-weight:900;font-size:clamp(32px,5vw,48px);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.top p{margin:0;opacity:.88;max-width:40em}
.score{text-align:right}
.score b{font:700 clamp(44px,7vw,72px)/1 var(--fn);display:block}
.score span{opacity:.85}
.meter{height:10px;background:color-mix(in srgb,var(--bandink) 22%,transparent);border-radius:6px;margin-top:20px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hl);width:0;transition:width .4s}
.gridwrap{overflow-x:auto;padding-bottom:4px}
.months,.cal{display:grid;grid-template-columns:28px repeat(var(--w),minmax(14px,1fr));gap:4px;min-width:340px}
.months{font-size:13px;color:var(--mute);margin-bottom:4px}
.cal{grid-template-rows:repeat(7,minmax(14px,26px));grid-auto-flow:column}
.wd{font-size:13px;color:var(--mute);display:flex;align-items:center}
.cell{border:0;border-radius:4px;padding:0;cursor:pointer;background:color-mix(in srgb,var(--c) 22%,var(--bg))}
.cell.done{background:var(--c)}
.cell.rest{background:var(--rest)}
.cell.exam{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--band) 35%,var(--bg)) 0 3px,var(--bg) 3px 6px)}
.cell.today{outline:3px solid var(--hl);outline-offset:1px}
.cell.fri{box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 5px var(--ink)}
.tag.econ{background:var(--band);color:#fff}
.enote{margin:6px 0;padding:6px 10px;border-left:4px solid var(--band);background:var(--bg);font-weight:500}
.econ-sec ol{margin:0;padding-left:1.3em}.econ-sec li{margin:6px 0}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 20px}
.dl div{background:var(--bg);border:var(--bw) solid var(--edge);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.dl b{font:700 26px/1.1 var(--fn);display:block}
.cell:focus-visible{outline:3px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:14px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.today{border-radius:14px}
#todayCard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--panel);border:var(--bw) solid var(--edge);border-radius:var(--r);box-shadow:var(--sh);padding:20px 24px}
#todayCard .d{font:700 40px/1 var(--fn);white-space:nowrap}
#todayCard .d small{display:block;font:500 14px "Noto Sans TC",sans-serif;color:var(--mute);margin-top:6px}
#todayCard h2{font-size:22px;line-height:1.35;margin:4px 0}
.tag{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:1px 10px}
.tag.job{color:var(--bg)}
.btn{font:inherit;font-size:16px;min-height:44px;padding:8px 18px;border-radius:var(--rs);border:2px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn.on{background:var(--ink);color:var(--bg)}
.btn:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.acts{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar label{display:flex;gap:8px;align-items:center;min-height:44px;cursor:pointer}
.bar input{width:20px;height:20px}
section.ph{border-top:1px solid var(--line);padding-top:24px;margin-top:24px}
.ph h3{font-size:24px;line-height:1.3;margin:0}
.ph .sub{color:var(--mute);margin:4px 0 12px}
.pbar{height:6px;background:var(--rest);border-radius:4px;overflow:hidden;max-width:360px;margin-bottom:12px}
.pbar i{display:block;height:100%;background:var(--ink)}
ol.days{list-style:none;margin:0;padding:0}
.day{display:grid;grid-template-columns:5.2em 44px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.day.now{background:color-mix(in srgb,var(--hl) 30%,var(--bg))}
.day .dt{font:500 15px var(--fn);white-space:nowrap}
.day .dt small{color:var(--mute);margin-left:4px;font-family:"Noto Sans TC",sans-serif}
.day .tx{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.day .min{color:var(--mute);font-size:14px;white-space:nowrap}
.day .rs{font-size:14px;white-space:nowrap}
.day.r .tx{color:var(--mute)}
.day.ok .tt{text-decoration:line-through;text-decoration-color:var(--mute);color:var(--mute)}
.ck{width:44px;height:44px;border-radius:var(--rs);border:2px solid var(--c);background:var(--bg);cursor:pointer;display:grid;place-items:center;padding:0}
.ck svg{width:22px;height:22px;opacity:0}
.ck.on{background:var(--c)}.ck.on svg{opacity:1}
.ck:focus-visible{outline:3px solid var(--hl)}
.hide-rest .day.r{display:none}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.rc{border:var(--bw) solid var(--edge);border-top:5px solid var(--c);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;background:var(--panel)}
.rc h4{margin:0 0 8px;font-size:18px}
.rc ul{margin:0;padding-left:1.1em}
.rc li{margin:6px 0}
.rule{background:var(--band);color:#fff;border-radius:var(--r);padding:20px 24px;margin-top:20px;display:grid;gap:4px}
.rule b{font-size:20px}
footer{color:var(--mute);font-size:14px}
h1,.score b{font-family:var(--fd)}
.score b{font-family:var(--fn)}
.sty{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sty button{font:inherit;font-size:15px;min-height:44px;padding:4px 16px;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:var(--rs);cursor:pointer}
.sty button[aria-pressed=true]{background:var(--bandink);color:var(--hdr)}
.sty button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
/* 科技風 */
:root[data-style=tech]{color-scheme:dark;--bg:#070b10;--ink:#d9f4ff;--mute:#7c93a6;--line:#16303f;--panel:#0c141c;--band:#00b8d9;--hdr:#070b10;--bandink:#d9f4ff;--hl:#00ffa3;--sql:#2f8bff;--excel:#00d68f;--py:#ffd60a;--np:#7aa2ff;--pbi:#b388ff;--viz:#00e5ff;--proj:#ff4d6d;--job:#9fb3c8;--rest:#121c26;--fd:"JetBrains Mono","Noto Sans TC",monospace;--fn:"JetBrains Mono",monospace;--r:4px;--rs:4px;--edge:#1f4357;--sh:0 0 24px rgba(0,229,255,.08)}
:root[data-style=tech] .top{background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);background-size:24px 24px;border-bottom:1px solid #1f4357}
:root[data-style=tech] h1{font-weight:700;letter-spacing:-.01em}
:root[data-style=tech] h1::before{content:"> ";color:var(--band)}
:root[data-style=tech] .meter i{box-shadow:0 0 12px var(--hl)}
:root[data-style=tech] .btn{border-color:var(--band);color:var(--band)}
:root[data-style=tech] .btn.on{background:var(--band);color:#001018}
:root[data-style=tech] .tag.econ{color:#001018}
:root[data-style=tech] .rule{background:#0c141c;border:1px solid var(--band);color:var(--ink)}
:root[data-style=tech] .sty button[aria-pressed=true]{background:var(--band);color:#001018;border-color:var(--band)}
/* 蘋果風 */
:root[data-style=apple]{--bg:light-dark(#ffffff,#000000);--ink:light-dark(#1d1d1f,#f5f5f7);--mute:light-dark(#6e6e73,#a1a1a6);--line:light-dark(#e8e8ed,#2c2c2e);--panel:light-dark(#f5f5f7,#1c1c1e);--band:#0071e3;--hdr:light-dark(#f5f5f7,#1c1c1e);--bandink:light-dark(#1d1d1f,#f5f5f7);--hl:#ffcc00;--sql:#0a84ff;--excel:#30d158;--py:#ff9f0a;--np:#5e5ce6;--pbi:#bf5af2;--viz:#64d2ff;--proj:#ff453a;--job:#8e8e93;--rest:light-dark(#f2f2f7,#1c1c1e);--fd:Inter,-apple-system,"Noto Sans TC",sans-serif;--fb:-apple-system,BlinkMacSystemFont,Inter,"Noto Sans TC",sans-serif;--fn:Inter,-apple-system,sans-serif;--r:22px;--rs:980px;--bw:0px;--sh:0 4px 24px rgba(0,0,0,.07)}
:root[data-style=apple] h1{font-weight:800;letter-spacing:-.035em}
:root[data-style=apple] .btn{border:0;background:var(--band);color:#fff}
:root[data-style=apple] .btn.on{background:var(--ink);color:var(--bg)}
:root[data-style=apple] .meter{background:var(--line);height:6px}
:root[data-style=apple] .meter i{background:var(--band)}
:root[data-style=apple] .rc{border-top:0;background:var(--bg)}
:root[data-style=apple] .rc h4::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
:root[data-style=apple] .ck{border-radius:50%}
:root[data-style=apple] .cell{border-radius:6px}
:root[data-style=apple] .sty button{border:0;background:var(--line)}
:root[data-style=apple] .sty button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
/* 普普風 */
:root[data-style=pop]{color-scheme:light;--bg:#ffffff;--ink:#111111;--mute:#3a3a3a;--line:#111111;--panel:#fff6c7;--band:#ff2e88;--hdr:#ffe14d;--bandink:#111111;--hl:#00d1ff;--sql:#2a5bff;--excel:#00b85c;--py:#ffb800;--np:#3d5afe;--pbi:#9b5de5;--viz:#00c2d1;--proj:#ff3b30;--job:#111111;--rest:#eeeeee;--fd:"Noto Sans TC",sans-serif;--fn:Bungee,"Noto Sans TC",sans-serif;--r:0px;--rs:0px;--bw:3px;--edge:#111111;--sh:6px 6px 0 #111111}
:root[data-style=pop] .top{background-image:radial-gradient(rgba(255,46,136,.35) 1.6px,transparent 1.9px);background-size:14px 14px;border-bottom:4px solid #111}
:root[data-style=pop] h1{text-shadow:3px 3px 0 #ff2e88}
:root[data-style=pop] .meter{background:#fff;border:3px solid #111;height:20px;border-radius:0}
:root[data-style=pop] .meter i{background:#ff2e88}
:root[data-style=pop] .btn{border:3px solid #111;box-shadow:4px 4px 0 #111;font-weight:700}
:root[data-style=pop] .btn.on{background:#ff2e88;color:#fff}
:root[data-style=pop] .cell{border:2px solid #111;border-radius:0}
:root[data-style=tech] .cell{border-radius:2px}
:root[data-style=pop] .ck,:root[data-style=pop] .tag{border:2px solid #111}
:root[data-style=pop] .rule{background:#2a5bff;border:3px solid #111;box-shadow:6px 6px 0 #111}
:root[data-style=pop] .day.now{background:#d6f6ff}
:root[data-style=pop] .sty button{border:3px solid #111;background:#fff;font-weight:700}
:root[data-style=pop] .sty button[aria-pressed=true]{background:#ff2e88;color:#fff}
@media(max-width:700px){.top .wrap{grid-template-columns:1fr}.score{text-align:left}#todayCard{grid-template-columns:1fr}.acts{flex-direction:row;flex-wrap:wrap}}
@media(max-width:600px){.day{grid-template-columns:4.6em 44px minmax(0,1fr)}.day .rs{grid-column:3}}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
</head>
<body>
<header class="top band"><div class="wrap">
  <div class="sty" role="group" aria-label="選擇風格"><button data-s="">原版</button><button data-s="tech">科技風</button><button data-s="apple">蘋果風</button><button data-s="pop">普普風</button></div>
  <div>
    <h1>數據分析實習準備計畫</h1>
    <p>2026/11/24 到 2027/3/31，每天一個小進度。目標：2027 暑期數據分析實習。</p>
  </div>
  <div class="score"><b id="pct">0%</b><span id="cnt">完成 0 / 0 個任務</span></div>
</div><div class="wrap"><div class="meter"><i id="meter"></i></div></div></header>

<main>
<div class="band"><div class="wrap">
  <div class="gridwrap"><div class="months" id="months"></div><div class="cal" id="cal"></div></div>
  <div class="legend" id="legend"></div>
</div></div>

<div class="band" style="padding-top:0"><div class="wrap">
  <div id="todayCard"></div>
</div></div>

<div class="band" style="padding-top:0"><div class="wrap" id="listWrap">
  <div class="bar">
    <a class="btn" href="#now" id="jump">跳到今天</a>
    <label><input type="checkbox" id="hideRest"> 隱藏期末考準備週</label>
  </div>
  <div id="phases"></div>
</div></div>


<div class="band" style="background:var(--panel)"><div class="wrap">
  <h3 style="font-size:28px;margin:0 0 6px">去哪裡學</h3>
  <p style="margin:0 0 18px;color:var(--mute)">都是免費資源。Kaggle 和 SQLBolt 是英文，但句子簡單，邊做邊查就好。</p>
  <div class="res" id="res"></div>
  <div class="rule"><b>學會的標準</b><span>關掉 AI 和筆記，自己寫得出來、講得出來，才算學會。卡住時可以問 Claude，但請它解釋觀念，不要直接給答案。</span></div>
</div></div>
</main>

<footer class="band"><div class="wrap">勾選紀錄只存在你現在用的這個瀏覽器。換裝置或清除瀏覽資料，勾選就會不見。</div></footer>

<script>
{
const CAT={sql:{n:'SQL',c:'var(--sql)'},excel:{n:'Excel',c:'var(--excel)'},py:{n:'Python',c:'var(--py)'},np:{n:'NumPy',c:'var(--np)'},pbi:{n:'Power BI',c:'var(--pbi)'},viz:{n:'視覺化',c:'var(--viz)'},proj:{n:'作品專案',c:'var(--proj)'},job:{n:'求職',c:'var(--job)'},rest:{n:'休息',c:'var(--rest)'},exam:{n:'期末考準備',c:'var(--band)'}};
const RES={
  sqlbolt:{n:'SQLBolt',u:'https://sqlbolt.com/',cat:'sql',note:'互動式 SQL 入門，每課 10–20 分鐘，從第 1 課照順序做'},
  leetcode:{n:'LeetCode SQL 50',u:'https://leetcode.com/studyplan/top-sql-50/',cat:'sql',note:'面試常見題型，Easy 題先做'},
  ksql:{n:'Kaggle：Intro to SQL',u:'https://www.kaggle.com/learn/intro-to-sql',cat:'sql',note:'選讀：用真實大資料練 SQL'},
  excel:{n:'Microsoft Excel 說明與學習',u:'https://support.microsoft.com/zh-tw/excel',cat:'excel',note:'官方中文教學，查函數和樞紐分析'},
  exceljet:{n:'Exceljet',u:'https://exceljet.net/',cat:'excel',note:'函數範例最清楚，忘記用法就查'},
  wage:{n:'計量資料夾的 WAGE1',u:'',cat:'excel',note:'用你電腦作業的 Data Sets- Excel 練習，不用另外找資料'},
  kpy:{n:'Kaggle：Python',u:'https://www.kaggle.com/learn/python',cat:'py',note:'7 課，每課有練習，直接在瀏覽器寫'},
  kpd:{n:'Kaggle：Pandas',u:'https://www.kaggle.com/learn/pandas',cat:'py',note:'6 課，學會讀資料、篩選、分組'},
  sm:{n:'計量資料夾的 README',u:'',cat:'py',note:'第 4 節是 statsmodels 指令對照表，第 5 節是常見錯誤'},
  smdoc:{n:'statsmodels 官方文件',u:'https://www.statsmodels.org/stable/index.html',cat:'py',note:'查 OLS、t_test、f_test 的用法'},
  hw:{n:'你的計量作業',u:'',cat:'py',note:'電腦作業 1 的 notebook，拿來逐行讀懂，再自己重寫'},
  numpy:{n:'NumPy 官方入門',u:'https://numpy.org/doc/stable/user/absolute_beginners.html',cat:'np',note:'英文，從建立陣列到基本運算，一頁看完'},
  pbistart:{n:'Power BI Desktop 快速入門',u:'https://learn.microsoft.com/zh-tw/power-bi/fundamentals/desktop-getting-started',cat:'pbi',note:'官方中文教學。Power BI Desktop 是免費的 Windows 程式，可從 Microsoft Store 安裝'},
  pbidocs:{n:'Power BI 官方文件',u:'https://learn.microsoft.com/zh-tw/power-bi/',cat:'pbi',note:'Power Query、視覺效果、DAX 都在這裡查'},
  kviz:{n:'Kaggle：Data Visualization',u:'https://www.kaggle.com/learn/data-visualization',cat:'viz',note:'用 seaborn 畫折線、長條、散布、熱圖'},
  datagov:{n:'政府資料開放平臺',u:'https://data.gov.tw/',cat:'proj',note:'找專案資料：房價、人口、交通、消費'},
  stat:{n:'中華民國統計資訊網',u:'https://www.stat.gov.tw/',cat:'proj',note:'主計總處的物價、薪資、GDP'},
  cbc:{n:'中央銀行',u:'https://www.cbc.gov.tw/',cat:'proj',note:'利率、貨幣供給，可以和貨銀結合'},
  github:{n:'GitHub',u:'https://github.com/',cat:'proj',note:'放作品集，附在履歷上'},
  job104:{n:'104 人力銀行',u:'https://www.104.com.tw/',cat:'job',note:'搜「數據分析實習」「商業分析實習」「研究助理」'}
};
const L=[];
const add=(d,c,t,m,r)=>L.push({d,c,t,m:m||0,r:r||''});
const rest=(a,b,t)=>{let x=new Date(ds(a)),e=new Date(ds(b));while(x<=e){L.push({d:md(x),c:'rest',t,m:0,r:''});x.setDate(x.getDate()+1)}};
function ds(k){const[m]=k.split('-').map(Number);return (m>=11?'2026-':'2027-')+k+'T00:00:00'}
function md(x){return String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
add('11-24','py','Kaggle Python 第 1 課：Hello, Python（變數、算式）。照 docs/github-setup.md 把資料夾設成 GitHub repo，從 Day 1 開始 commit',45,'kpy');
add('11-25','py','Kaggle Python 第 2 課前半：函式（今天手寫作業優先）',20,'kpy');
add('11-26','py','做完 Kaggle Python 第 2 課（今晚手寫作業 3 截止）',20,'kpy');
add('11-27','py','Kaggle Python 第 3 課：布林值與條件判斷',30,'kpy');
add('11-28','py','Kaggle Python 第 4 課：List',30,'kpy');

function grid(){
  const start=new Date(first);start.setDate(start.getDate()-((start.getDay()+6)%7));
  const weeks=Math.ceil(((last-start)/864e5+1)/7);
  const cal=document.getElementById('cal'),mo=document.getElementById('months');
  cal.style.setProperty('--w',weeks);mo.style.setProperty('--w',weeks);
  const map={};L.forEach(x=>map[x.d]=x);
  let h='',m='<span></span>';
  '一二三四五六日'.split('').forEach((w,i)=>h+=`<span class="wd" style="grid-row:${i+1};grid-column:1">${i%2?'':w}</span>`);
  for(let w=0;w<weeks;w++){let lab='';for(let i=0;i<7;i++){const t=new Date(start);t.setDate(t.getDate()+w*7+i);const k=md(t),x=map[k];
      if(t.getDate()===1||(w===0&&i===0))lab=(t.getMonth()+1)+'月';
      if(!x||t<first||t>last){h+=`<span style="grid-row:${i+1};grid-column:${w+2}"></span>`;continue}
      const cls=['cell',x.c==='rest'?'rest':'',x.c==='exam'?'exam':'',done[k]?'done':'',k===todayKey?'today':'',ECON[k]?'fri':''].join(' ');
      h+=`<button class="${cls}" style="grid-row:${i+1};grid-column:${w+2};--c:${CAT[x.c].c}" data-k="${k}" title="${t.getMonth()+1}/${t.getDate()} ${x.t}" aria-label="${t.getMonth()+1}月${t.getDate()}日：${x.t}"></button>`}
    m+=`<span>${lab}</span>`}
  cal.innerHTML=h;mo.innerHTML=m;
}
function todayCard(){
